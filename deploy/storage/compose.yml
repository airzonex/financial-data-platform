name: fdp-storage

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set admin password}
      POSTGRES_DB: financial
      FDP_APP_PASSWORD: ${FDP_APP_PASSWORD:?Set application password}
      TZ: UTC

    ports:
      - "${STORAGE_BIND_IP:?Set storage IP}:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../../postgres/init:/opt/fdp/schema:ro

    shm_size: 128mb

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d financial
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE}
    user: "65532:65532"
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MinIO admin user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MinIO admin password}

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "${STORAGE_BIND_IP:?Set storage IP}:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - type: bind
        source: /srv/fdp/minio
        target: /data
        bind:
          create_host_path: false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:?Set MINIO_CLIENT_IMAGE}
    profiles: ["tools"]
    restart: "no"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MinIO admin user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MinIO admin password}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MinIO application user}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MinIO application password}

    volumes:
      - ./minio-init:/init:ro

    entrypoint: ["/bin/sh", "/init/bootstrap.sh"]

volumes:
  postgres_data:
    name: fdp-storage-postgres-data