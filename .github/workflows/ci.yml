name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: financial_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U airflow -d financial_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Airflow
        run: |
          pip install \
            "apache-airflow==3.3.1" \
            --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check PostgreSQL
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://airflow:airflow@localhost:5433/financial_test').close()"

      - name: Lint
        run: ruff check src/ tests/ airflow/

      - name: Type check
        run: mypy

      - name: Run unit tests
        run: pytest tests/unit
