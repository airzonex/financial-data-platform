name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: financial_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U airflow -d financial_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Airflow
        run: |
          pip install \
            "apache-airflow==3.3.1" \
            --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check PostgreSQL
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://airflow:airflow@localhost:5433/financial_test').close()"

      - name: Check MinIO
        run: |
          python -c "
          from minio import Minio
          Minio('localhost:9000', access_key='minioadmin', secret_key='minioadmin', secure=False).list_buckets()
          "

      - name: Init database schemas
        env:
          PGPASSWORD: airflow
        run: |
          for f in postgres/init/*; do
            echo "Applying $f"
            psql -h localhost -p 5433 -U airflow -d financial_test -f "$f"
          done

      - name: Lint
        run: ruff check src/ tests/ airflow/

      - name: Type check
        run: mypy

      - name: Run unit tests
        run: pytest tests/unit

      - name: Run integration tests
        run: pytest tests/integration

      - name: Run e2e tests
        run: pytest tests/e2e

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: UTC
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_PORT: 5433
      AIRFLOW_PORT: 8080
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      AIRFLOW_UID: 50000
      AIRFLOW_ADMIN_USERNAME: admin
      AIRFLOW_ADMIN_PASSWORD: admin
      AIRFLOW_FERNET_KEY: "HW5rPGPCgbzgSImM9EBrWELw_rWNsyocqTPG55PzaIc="
      AIRFLOW_SECRET_KEY: "ci-secret-key"
      AIRFLOW_JWT_SECRET_KEY: "ci-jwt-secret-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps -a

      - name: Check PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Wait for service initialization
        run: |
          for i in {1..60}; do
            airflow_status="$(docker inspect -f '{{.State.Status}}' financial-airflow-init)"
            minio_status="$(docker inspect -f '{{.State.Status}}' financial-minio-init)"

            if [ "$airflow_status" = "exited" ] && [ "$minio_status" = "exited" ]; then
              break
            fi

            echo "Waiting for initialization..."
            echo "airflow-init: $airflow_status"
            echo "minio-init: $minio_status"
            sleep 2
          done
          
          test "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' financial-airflow-init)" = "exited 0"
          test "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' financial-minio-init)" = "exited 0"

      - name: Check MinIO
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:${MINIO_API_PORT}/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO..."
            sleep 2
          done
          echo "MinIO did not become ready"
          exit 1

      - name: Wait for Airflow API
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:${AIRFLOW_PORT}/api/v2/monitor/health > /dev/null; then
              echo "Airflow API is ready"
              exit 0
            fi
            echo "Waiting for Airflow API..."
            sleep 2
          done
          echo "Airflow API did not become ready"
          exit 1

      - name: Check Airflow services
        run: |
          test "$(docker inspect -f '{{.State.Status}}' financial-airflow-api-server)" = "running"
          test "$(docker inspect -f '{{.State.Status}}' financial-airflow-scheduler)" = "running"
          test "$(docker inspect -f '{{.State.Status}}' financial-airflow-dag-processor)" = "running"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v