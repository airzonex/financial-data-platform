name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: financial_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U airflow -d financial_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Airflow
        run: |
          pip install \
            "apache-airflow==3.3.1" \
            --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check PostgreSQL
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://airflow:airflow@localhost:5433/financial_test').close()"

      - name: Check MinIO
        run: |
          python -c "
          from minio import Minio
          Minio('localhost:9000', access_key='minioadmin', secret_key='minioadmin', secure=False).list_buckets()
          "

      - name: Init database schemas
        env:
          PGPASSWORD: airflow
        run: |
          for f in postgres/init/*; do
            echo "Applying $f"
            psql -h localhost -p 5433 -U airflow -d financial_test -f "$f"
          done

      - name: Lint
        run: ruff check src/ tests/ airflow/

      - name: Type check
        run: mypy

      - name: Run unit tests
        run: pytest tests/unit

      - name: Run integration tests
        run: pytest tests/integration

      - name: Run e2e tests
        run: pytest tests/e2e

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-24.04

    env:
      TZ: UTC
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_PORT: 5433
      AIRFLOW_PORT: 8080
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      AIRFLOW_UID: 50000
      AIRFLOW_ADMIN_USERNAME: admin
      AIRFLOW_ADMIN_PASSWORD: admin
      AIRFLOW_FERNET_KEY: "00000000000000000000000000000000"
      AIRFLOW_SECRET_KEY: "ci-secret-key"
      AIRFLOW_JWT_SECRET_KEY: "ci-jwt-secret-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build
