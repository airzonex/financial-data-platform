services:

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================

  postgres:
    image: postgres:17
    container_name: financial-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - financial


  # ===========================================================================
  # Airflow initialization
  # ===========================================================================

  airflow-init:
    image: apache/airflow:3.3.1-python3.12
    container_name: financial-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      TZ: ${TZ}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: >-
        ${AIRFLOW_ADMIN_USERNAME}:${AIRFLOW_ADMIN_ROLE}

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config

    command:
      - airflow
      - db
      - migrate

    networks:
      - financial


  # ===========================================================================
  # Airflow API server
  # ===========================================================================

  airflow-api-server:
    image: apache/airflow:3.3.1-python3.12
    container_name: financial-airflow-api-server
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      TZ: ${TZ}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: >-
        ${AIRFLOW_ADMIN_USERNAME}:${AIRFLOW_ADMIN_ROLE}

    user: "${AIRFLOW_UID}:0"

    ports:
      - "${AIRFLOW_PORT}:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config

    command:
      - airflow
      - api-server
      - --port
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - financial


  # ===========================================================================
  # Airflow scheduler
  # ===========================================================================

  airflow-scheduler:
    image: apache/airflow:3.3.1-python3.12
    container_name: financial-airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      TZ: ${TZ}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: >-
        ${AIRFLOW_ADMIN_USERNAME}:${AIRFLOW_ADMIN_ROLE}

    user: "${AIRFLOW_UID}:0"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config

    command:
      - airflow
      - scheduler

    networks:
      - financial


  # ===========================================================================
  # MinIO
  # ===========================================================================

  minio:
    image: minio/minio:latest
    container_name: financial-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - financial


  # ===========================================================================
  # MinIO initialization
  # ===========================================================================

  minio-init:
    image: minio/mc:latest
    container_name: financial-minio-init

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./minio/init:/init:ro

    entrypoint:
      - /bin/sh
      - /init/create-buckets.sh

    networks:
      - financial


# =============================================================================
# Volumes
# =============================================================================

volumes:

  postgres_data:
    name: financial-postgres-data

  minio_data:
    name: financial-minio-data


# =============================================================================
# Network
# =============================================================================

networks:

  financial:
    name: financial-network
    driver: bridge
