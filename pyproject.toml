[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-data-platform"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "minio",
    "psycopg[binary]",
	"dbt-core",
	"dbt-postgres",
	"bs4"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"

]

[tool.setuptools.packages.find]
where = ["src"]
